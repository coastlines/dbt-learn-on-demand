version: 2
models:
- name: fct_customer_orders
  config:
    group: erica
  description: This model consolidates customer order data, integrating information
    from customers, orders, and payments to provide a comprehensive view of customer
    transactions. It includes details such as order status, payment amounts, and customer
    lifetime value, enabling analysis of customer purchasing behavior and transaction
    history.
  columns:
  - name: order_id
    description: A unique identifier for each order.
  - name: customer_id
    description: A unique identifier for each customer.
  - name: order_placed_at
    description: The date and time when the order was placed.
  - name: order_status
    description: The current status of the order, such as pending or completed.
  - name: total_amount_paid
    description: The total amount paid for the order.
  - name: payment_finalized_date
    description: The date when the payment for the order was finalized.
  - name: customer_first_name
    description: The first name of the customer who placed the order.
  - name: customer_last_name
    description: The last name of the customer who placed the order.
  - name: transaction_seq
    description: The sequence number of the transaction in the order of all transactions.
  - name: customer_sales_seq
    description: The sequence number of the transaction for the specific customer.
  - name: nvsr
    description: Indicates whether the customer is new or returning based on their
      order history.
  - name: customer_lifetime_value
    description: The total value of all orders placed by the customer over time.
  - name: fdos
    description: The first date of sale for the customer.
